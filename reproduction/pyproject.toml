[project]
name = "softelo-release"
version = "0.1.0"
description = "Soft-Elo annotations and reproducible rating evaluation"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.3.3",
  "scipy==1.17.1",
  "scikit-learn==1.8.0",
  "pyarrow>=15,<24",
  "datasets>=3,<5",
  "huggingface-hub>=0.30,<2",
]

[project.scripts]
softelo-export = "softelo_release.export:main"
softelo-validate = "softelo_release.validate:main"
softelo-reproduce = "softelo_release.reproduce:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"references" = "softelo_release/references"
